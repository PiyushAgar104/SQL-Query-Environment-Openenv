[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-sql-query-env"
version = "0.1.0"
description = "SQL Query Environment for OpenEnv - teaches AI agents to write correct SQL queries against a real database schema"
requires-python = ">=3.10"
dependencies = [
    "openenv-core[core]>=0.2.2",
    "fastapi>=0.115.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.24.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]
inference = [
    "openai>=1.0.0",
]

[project.scripts]
server = "sql_query_env.server.app:main"

[tool.setuptools]
include-package-data = true
packages = ["sql_query_env", "sql_query_env.server"]
package-dir = { "sql_query_env" = ".", "sql_query_env.server" = "server" }
